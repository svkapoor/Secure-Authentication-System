{% extends "base.html" %}
{% block title %}Vault · Password Manager{% endblock %}
{% block content %}
<section class="card">
  <div class="card-body">
    <p class="eyebrow">Encrypted vault</p>
    <h1>Hello, {{ username }}!</h1>
    <p class="muted">You are viewing items stored inside your Password Manager vault.</p>
    <div class="actions">
      <form method="post" action="{{ url_for('refresh') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <button type="submit">Refresh access token</button>
      </form>
      <a class="ghost" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>
</section>
{% endblock %}
